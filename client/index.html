<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#a9bfcb" />
  <title>音遇 · Children of the Melody</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='38' fill='%23f2c989'/><circle cx='50' cy='50' r='20' fill='%23fff8e8'/></svg>" />
  <style>
    :root {
      --ink: #fffaf0;
      --ink-soft: rgba(255, 250, 240, 0.72);
      --ink-faint: rgba(255, 250, 240, 0.44);
      --glass: rgba(25, 37, 49, 0.44);
      --glass-strong: rgba(23, 33, 45, 0.78);
      --line: rgba(255, 248, 225, 0.18);
      --line-active: rgba(255, 241, 199, 0.58);
      --light: #fff1c7;
      --sun: #f2c989;
      --coral: #df9185;
      --green: #9bd6b1;
      --shadow: 0 12px 38px rgba(16, 28, 39, 0.2);
      --safe-top: max(14px, env(safe-area-inset-top));
      --safe-right: max(14px, env(safe-area-inset-right));
      --safe-bottom: max(14px, env(safe-area-inset-bottom));
      --safe-left: max(14px, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      color: var(--ink);
      background: #a9bfcb;
      font-family: "HarmonyOS Sans SC", "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      letter-spacing: 0;
      user-select: none;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button { color: inherit; }
    button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--light); outline-offset: 3px; }
    svg { display: block; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; }
    /* 拖拽转视角绝不能变成浏览器原生行为：全站禁元素拖拽；输入框保留文字选择 */
    * { -webkit-user-drag: none; }
    input, textarea { user-select: text; -webkit-user-select: text; }

    .panel {
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px) saturate(1.08);
      -webkit-backdrop-filter: blur(14px) saturate(1.08);
    }
    .icon-btn {
      width: 34px; height: 34px; flex: none; display: grid; place-items: center;
      border: 0; border-radius: 50%; color: var(--ink);
      background: rgba(255, 250, 240, 0.08); cursor: pointer;
      transition: background .2s ease, transform .2s ease;
    }
    .icon-btn:hover { background: rgba(255, 250, 240, 0.18); transform: translateY(-1px); }
    .icon-btn svg { width: 16px; height: 16px; stroke-width: 1.8; }

    /* 入场：让世界保持可见，选择器只占画面中央的一小块。 */
    #enter {
      position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
      padding: 24px; background: rgba(21, 35, 48, 0.2);
      transition: opacity .8s ease, visibility .8s;
    }
    #enter::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, rgba(18, 35, 48, .2), transparent 32%, transparent 64%, rgba(18, 31, 44, .32));
    }
    #enter.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .enter-card {
      position: relative; z-index: 1; width: min(560px, 92vw); text-align: center;
      animation: enter-rise .9s ease both;
    }
    @keyframes enter-rise { from { opacity: 0; transform: translateY(16px); } }
    .sigil {
      width: 42px; height: 42px; margin: 0 auto 14px; border-radius: 50%;
      background: radial-gradient(circle, #fffbe9 0 12%, #f6d599 28%, rgba(246, 213, 153, .16) 31% 48%, transparent 50%);
      filter: drop-shadow(0 0 13px rgba(255, 233, 185, .72));
    }
    .enter-card h1 { font-size: clamp(32px, 6vh, 48px); font-weight: 300; text-shadow: 0 2px 18px rgba(25, 34, 44, .3); }
    .enter-card > .sub { margin: 6px 0 24px; color: var(--ink-soft); font-size: 13px; }
    .avatar-picker { margin: 0 auto 18px; }
    .avatar-picker .label { margin-bottom: 9px; color: var(--ink-faint); font-size: 11px; }
    #avatarGrid {
      display: flex; gap: 8px; width: 100%; padding: 4px 2px 8px;
      overflow-x: auto; overscroll-behavior-inline: contain; scrollbar-width: none;
    }
    #avatarGrid::-webkit-scrollbar { display: none; }
    .avatar-card {
      width: 54px; min-width: 54px; min-height: 70px; display: grid; justify-items: center; align-content: start; gap: 5px;
      border: 0; color: var(--ink-soft); background: transparent; cursor: pointer;
    }
    .avatar-card b { display: block; width: 58px; overflow: hidden; font-size: 10px; font-weight: 400; white-space: nowrap; text-overflow: ellipsis; }
    .avatar-card small { display: none; }
    .avatar-swatch {
      width: 38px; height: 38px; border: 1px solid transparent; border-radius: 50%;
      box-shadow: inset 0 -8px rgba(25, 37, 49, .12), 0 3px 12px rgba(20, 30, 38, .14);
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .avatar-card:hover .avatar-swatch { transform: translateY(-2px); }
    .avatar-card.active { color: var(--ink); }
    .avatar-card.active .avatar-swatch { border-color: var(--light); box-shadow: 0 0 0 3px rgba(255, 241, 199, .14), 0 0 18px rgba(255, 232, 174, .48); transform: translateY(-2px); }
    .avatar-classic { background: linear-gradient(145deg, #fff0cf 0 28%, #eeb36d 29% 68%, #dc8d83 69%); }
    .avatar-hooded { background: linear-gradient(145deg, #6f7291 0 34%, #a09ab0 35% 70%, #efd29f 71%); }
    .avatar-minion, .avatar-duck { background: linear-gradient(145deg, #fff0a8 0 42%, #e9bd6d 43% 72%, #d9877f 73%); }
    .avatar-corgi { background: linear-gradient(145deg, #fff0d2 0 38%, #c9865e 39% 70%, #efd29f 71%); }
    .avatar-seal { background: linear-gradient(145deg, #d9edff 0 42%, #94b9d6 43% 72%, #829caf 73%); }
    .avatar-elaina { background: linear-gradient(145deg, #efeff6 0 30%, #4a465b 31% 62%, #9b93c9 63% 84%, #6e6689 85%); }
    .avatar-owl { background: linear-gradient(145deg, #f5d7b5 0 38%, #9b6f62 39% 72%, #6a4f65 73%); }
    .avatar-platypus { background: linear-gradient(145deg, #d4f0df 0 42%, #83b99c 43% 72%, #f4bf87 73%); }
    .enter-row { display: flex; justify-content: center; gap: 8px; }
    .enter-card input {
      width: min(240px, 58vw); height: 42px; padding: 0 18px; text-align: center;
      color: var(--ink); background: rgba(25, 37, 49, .4); border: 1px solid var(--line); border-radius: 21px;
      outline: none; backdrop-filter: blur(12px);
    }
    .enter-card input::placeholder { color: var(--ink-faint); }
    .btn-main {
      height: 42px; padding: 0 20px; border: 1px solid rgba(255, 246, 218, .55); border-radius: 21px;
      color: #3d4344; font-size: 13px; font-weight: 600; background: rgba(255, 241, 199, .92);
      box-shadow: 0 4px 18px rgba(255, 224, 165, .26); cursor: pointer;
    }
    .btn-main:hover { background: #fff5d7; }
    .enter-tip { margin-top: 13px; color: var(--ink-faint); font-size: 10px; }

    /* 游戏内只保留三个图形锚点：连接、翼能、音乐。 */
    .hud { position: fixed; z-index: 20; opacity: 0; pointer-events: none; transition: opacity .7s ease .25s; }
    body.playing .hud { opacity: 1; pointer-events: auto; }
    #connectionStatus {
      top: var(--safe-top); right: var(--safe-right); width: 32px; height: 32px; display: grid; place-items: center;
      color: var(--green); border: 0; border-radius: 50%; background: rgba(25, 37, 49, .22); box-shadow: none;
    }
    #connectionStatus svg { width: 14px; height: 14px; stroke-width: 1.8; }
    #connectionStatus.solo { color: var(--sun); }
    #connectionStatus.off { color: var(--coral); }

    #flaps {
      top: var(--safe-top); left: 50%; transform: translateX(-50%); display: flex; gap: 6px;
      padding: 8px 10px; border: 0; border-radius: 16px; background: rgba(25, 37, 49, .18); box-shadow: none;
    }
    #flaps i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 250, 240, .2); transition: background .3s, box-shadow .3s; }
    #flaps i.on { background: var(--light); box-shadow: 0 0 8px rgba(255, 233, 184, .9); }

    #musicButton {
      left: 50%; bottom: var(--safe-bottom); width: 44px; height: 44px; display: grid; place-items: center;
      color: var(--ink); border-radius: 50%; transform: translateX(-50%); cursor: pointer;
      box-shadow: 0 5px 18px rgba(16, 28, 39, .2), 0 0 14px color-mix(in srgb, var(--track-color, var(--sun)) 52%, transparent);
    }
    #musicButton svg { width: 18px; height: 18px; stroke-width: 1.7; }
    #musicButton.playing { color: var(--track-color, var(--light)); border-color: color-mix(in srgb, var(--track-color, var(--light)) 62%, transparent); }
    #musicButton.paused { opacity: .68; }
    #npPlay { display: none; }
    #npPlay.available { display: grid; }

    #nearbyWrap {
      right: var(--safe-right); top: calc(var(--safe-top) + 44px); width: 188px; padding: 10px 12px; border-radius: 8px;
      transform: translateX(10px); visibility: hidden; opacity: 0 !important;
      transition: opacity .3s ease, transform .3s ease, visibility .3s;
    }
    #nearbyWrap.has-people { visibility: visible; opacity: 1 !important; transform: none; }
    #nearbyWrap h3 { margin-bottom: 5px; color: var(--ink-faint); font-size: 9px; font-weight: 400; }
    .nb-item { display: grid; grid-template-columns: 6px minmax(0, 1fr); align-items: center; gap: 7px; padding: 4px 0; }
    .nb-dot { width: 5px; height: 5px; border-radius: 50%; }
    .nb-name { overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .nb-track { overflow: hidden; color: var(--ink-faint); font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }
    .nb-bar, .nb-empty { display: none; }

    #hints {
      top: var(--safe-top); left: var(--safe-left); padding: 8px 12px; border-radius: 8px;
      color: var(--ink-soft); font-size: 10px; line-height: 1.7;
    }
    #hints b { color: var(--ink); font-weight: 500; }
    body.playing #hints { animation: hint-away .8s ease 8s forwards; }
    @keyframes hint-away { to { opacity: 0; visibility: hidden; } }

    /* 曲库使用与右下操作菜单相同的紧凑浮层语言。 */
    #trackModal {
      position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center;
      padding: 0 14px calc(var(--safe-bottom) + 52px); background: transparent;
      opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .18s ease, visibility .18s;
    }
    #trackModal.open { opacity: 1; visibility: visible; pointer-events: auto; }
    #trackModal .box {
      width: min(410px, 100%); max-height: min(68vh, 520px); padding: 8px; overflow-y: auto;
      border-radius: 7px; transform: translateY(6px) scale(.98); transform-origin: bottom center;
      transition: transform .18s ease; scrollbar-width: thin;
    }
    #trackModal.open .box { transform: none; }
    .modal-head { min-height: 39px; display: flex; align-items: center; gap: 6px; padding: 0 1px 7px; margin-bottom: 7px; border-bottom: 1px solid var(--line); }
    .modal-head > div { flex: 1; min-width: 0; }
    #trackModal h2 { font-size: 11px; font-weight: 500; }
    #trackModal .sub { margin-top: 2px; overflow: hidden; color: var(--ink-faint); font-size: 8px; white-space: nowrap; text-overflow: ellipsis; }
    #trackModal .icon-btn { width: 30px; height: 30px; }
    #trackModal .icon-btn svg { width: 14px; height: 14px; }
    #trackGrid, #songGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .track-card {
      min-width: 0; min-height: 40px; display: grid; grid-template-columns: 7px minmax(0, 1fr); align-items: center; gap: 7px;
      padding: 0 7px; text-align: left; color: var(--ink-soft); background: transparent;
      border: 1px solid transparent; border-radius: 4px; cursor: pointer; transition: background .18s, border-color .18s, color .18s;
    }
    .track-card:hover { color: var(--ink); background: rgba(255, 250, 240, .08); border-color: var(--line); }
    .track-card.active { color: var(--ink); border-color: var(--line-active); background: rgba(255, 241, 199, .09); }
    .track-card .dot { grid-row: 1; width: 6px; height: 6px; margin: 0; border-radius: 50%; }
    .track-card .nm { grid-column: 2; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .track-card .ds { display: none; }
    .source-details { margin-top: 7px; border-top: 1px solid var(--line); }
    .source-details summary {
      min-height: 32px; display: flex; align-items: center; padding: 0 4px;
      color: var(--ink-soft); font-size: 9px; cursor: pointer; list-style: none;
    }
    .source-details summary:hover { color: var(--ink); }
    .source-details summary::-webkit-details-marker { display: none; }
    .source-details summary::before { content: "+"; width: 15px; color: var(--ink-faint); }
    .source-details[open] summary::before { content: "−"; }
    .url-row { display: grid; grid-template-columns: 1.15fr .85fr 30px; gap: 4px; padding: 1px 3px 5px; }
    .url-row input {
      min-width: 0; height: 30px; padding: 0 8px; color: var(--ink); background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line); border-radius: 4px; outline: none; font-size: 9px;
    }
    .url-row input::placeholder { color: var(--ink-faint); }
    .source-details #songGrid { padding: 1px 3px 0; }
    .upload-card {
      min-height: 32px; display: flex; align-items: center; justify-content: center; gap: 6px; margin: 4px 3px 5px;
      color: var(--ink-soft); font-size: 9px; border: 1px dashed var(--line); border-radius: 4px; cursor: pointer;
    }
    .upload-card svg { width: 13px; height: 13px; }
    .upload-card:hover { color: var(--ink); border-color: var(--line-active); background: rgba(255, 250, 240, .04); }
    .upload-card.uploading { opacity: .5; pointer-events: none; }
    .songs-empty { grid-column: 1 / -1; padding: 6px 3px 8px; color: var(--ink-faint); font-size: 9px; }

    #toasts { position: fixed; top: calc(var(--safe-top) + 44px); left: 50%; z-index: 45; display: flex; flex-direction: column; align-items: center; gap: 6px; transform: translateX(-50%); pointer-events: none; }
    .toast {
      max-width: min(420px, 86vw); padding: 8px 13px; color: var(--ink); background: rgba(24, 35, 46, .7);
      border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
      font-size: 10px; text-align: center; animation: toast-in .35s ease both;
    }
    .toast.out { animation: toast-out .45s ease both; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-6px); } }
    @keyframes toast-out { to { opacity: 0; transform: translateY(-6px); } }

    .hand-invite {
      position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 58px); z-index: 45; display: flex; align-items: center; gap: 7px;
      padding: 7px 8px 7px 13px; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--line);
      border-radius: 22px; box-shadow: var(--shadow); backdrop-filter: blur(12px); transform: translateX(-50%); font-size: 11px;
    }
    .hand-invite b { color: var(--light); font-weight: 500; }
    .hand-invite button, .hi-yes {
      min-height: 30px; padding: 0 11px; color: var(--ink); background: rgba(255, 255, 255, .06);
      border: 1px solid var(--line); border-radius: 15px; cursor: pointer; font-size: 10px;
    }
    .hand-invite .hi-yes { color: #374246; background: var(--light); }

    /* main.ts / touch.ts 生成的覆盖层。 */
    .instrument-keys { position: fixed; left: 50%; bottom: 8%; z-index: 35; display: none; align-items: flex-end; gap: 5px; transform: translateX(-50%); user-select: none; }
    .instrument-key { width: 42px; min-height: 48px; padding: 7px 0 5px; color: var(--ink); text-align: center; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; touch-action: none; transition: background .08s, box-shadow .08s; }
    .instrument-key strong { display: block; font-size: 13px; font-weight: 500; }
    .instrument-key small { color: var(--ink-faint); font-size: 8px; }
    .octave-label { position: absolute; top: -22px; left: 50%; color: var(--ink-soft); font-size: 9px; white-space: nowrap; transform: translateX(-50%); }
    .book-btn { position: fixed; left: calc(var(--safe-left, 0px) + 14px); bottom: 14px; z-index: 38; width: 44px; height: 44px; font-size: 20px; color: var(--ink); background: var(--glass-strong, rgba(25, 37, 49, .55)); border: 1px solid var(--line, rgba(255, 250, 240, .16)); border-radius: 12px; backdrop-filter: blur(8px); cursor: pointer; }
    .book-btn:hover { background: rgba(25, 37, 49, .75); }
    .book-panel { position: fixed; left: calc(var(--safe-left, 0px) + 14px); bottom: 66px; z-index: 38; width: min(320px, 82vw); max-height: 46vh; overflow-y: auto; padding: 14px; background: rgba(16, 24, 34, .92); border: 1px solid rgba(255, 250, 240, .18); border-radius: 14px; box-shadow: 0 12px 40px rgba(0, 0, 0, .35); }
    .book-row { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid rgba(255, 250, 240, .08); }
    .book-row i { flex: none; width: 12px; height: 12px; border-radius: 50%; box-shadow: 0 0 8px currentColor; }
    .book-row b { display: block; font-size: 13px; }
    .book-row small { color: rgba(255, 250, 240, .55); font-size: 11px; }
    .book-empty { color: rgba(255, 250, 240, .6); font-size: 12px; line-height: 1.8; text-align: center; padding: 18px 6px; }
    .book-close { text-align: center; padding-top: 10px; color: rgba(255, 250, 240, .5); font-size: 12px; cursor: pointer; }
    .chat-input { position: fixed; left: 50%; bottom: 12%; z-index: 40; display: none; width: min(380px, 76vw); height: 40px; padding: 0 16px; color: var(--ink); background: var(--glass-strong); border: 1px solid var(--line-active); border-radius: 20px; box-shadow: var(--shadow); outline: none; transform: translateX(-50%); font-size: 13px; }
    .chat-input::placeholder { color: var(--ink-faint); }
    .emote-wheel { position: fixed; left: 50%; top: 50%; z-index: 50; display: none; grid-template-columns: repeat(3, 58px); gap: 7px; padding: 10px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); transform: translate(-50%, -50%); }
    .emote-btn { width: 58px; height: 54px; display: grid; place-items: center; gap: 2px; color: var(--ink-soft); background: rgba(255, 255, 255, .04); border: 1px solid transparent; border-radius: 5px; cursor: pointer; font-size: 9px; }
    .emote-btn:hover, .emote-btn:focus { color: var(--ink); background: rgba(255, 255, 255, .1); border-color: var(--line); }
    .emote-btn span { font-size: 18px; }
    .ping-badge { display: none !important; }

    /* 桌面操作层：默认只露出一个入口，按需展开键盘功能。 */
    .desktop-actions {
      position: fixed; right: var(--safe-right); bottom: var(--safe-bottom); z-index: 31;
      display: none; flex-direction: column; align-items: flex-end; gap: 8px;
      opacity: 0; pointer-events: none; transition: opacity .5s ease .25s;
    }
    body.playing .desktop-actions { opacity: 1; pointer-events: auto; }
    .action-trigger {
      width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink-soft);
      border: 1px solid var(--line); border-radius: 50%; background: rgba(25, 37, 49, .3);
      box-shadow: 0 5px 18px rgba(16, 28, 39, .16); backdrop-filter: blur(10px); cursor: pointer;
    }
    .action-trigger:hover, .desktop-actions.open .action-trigger { color: var(--ink); background: rgba(25, 37, 49, .54); }
    .action-trigger svg { width: 17px; height: 17px; stroke-width: 1.7; }
    .action-menu {
      width: 216px; padding: 8px; border-radius: 7px; visibility: hidden; opacity: 0;
      transform: translateY(6px) scale(.98); transform-origin: bottom right; pointer-events: none;
      transition: opacity .18s ease, transform .18s ease, visibility .18s;
    }
    .desktop-actions.open .action-menu { visibility: visible; opacity: 1; transform: none; pointer-events: auto; }
    .action-section + .action-section { margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--line); }
    .action-section-title { margin: 0 4px 5px; color: var(--ink-faint); font-size: 8px; }
    .action-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
    .action-grid.instruments { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .action-item {
      position: relative; min-width: 0; min-height: 36px; display: flex; align-items: center; gap: 7px; padding: 0 7px;
      color: var(--ink-soft); background: transparent; border: 1px solid transparent; border-radius: 4px; cursor: pointer;
    }
    .action-item:hover, .action-item.active { color: var(--ink); background: rgba(255, 250, 240, .08); border-color: var(--line); }
    .action-item svg { width: 14px; height: 14px; flex: none; stroke-width: 1.7; }
    .action-item .label { min-width: 0; overflow: hidden; font-size: 10px; white-space: nowrap; text-overflow: ellipsis; }
    .action-item kbd {
      min-width: 17px; height: 17px; margin-left: auto; display: grid; place-items: center;
      color: var(--ink-faint); background: rgba(255, 250, 240, .07); border: 1px solid rgba(255, 250, 240, .1);
      border-radius: 3px; font: 8px/1 system-ui, sans-serif;
    }
    .action-grid.instruments .action-item { min-height: 50px; flex-direction: column; justify-content: center; gap: 3px; padding: 4px 2px; }
    .action-grid.instruments .action-item kbd { position: absolute; top: 3px; right: 3px; margin: 0; }

    .touch-root { position: fixed; inset: 0; z-index: 32; display: none; pointer-events: none; }
    .touch-joystick { position: absolute; left: calc(var(--safe-left) + 8px); bottom: calc(var(--safe-bottom) + 64px); width: 92px; height: 92px; border: 1px solid rgba(255, 250, 240, .18); border-radius: 50%; background: rgba(25, 37, 49, .16); pointer-events: auto; touch-action: none; }
    .touch-knob { position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; border: 1px solid rgba(255, 250, 240, .36); border-radius: 50%; background: rgba(255, 250, 240, .22); transform: translate(-50%, -50%); }
    .touch-cluster { position: absolute; right: calc(var(--safe-right) + 4px); bottom: calc(var(--safe-bottom) + 62px); display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: auto; }
    .touch-row, .touch-small-row { display: flex; gap: 7px; align-items: center; }
    .touch-btn { display: grid; place-items: center; color: var(--ink); background: rgba(25, 37, 49, .34); border: 1px solid rgba(255, 250, 240, .24); border-radius: 50%; backdrop-filter: blur(6px); touch-action: none; }
    .touch-btn svg { width: 17px; height: 17px; stroke-width: 1.7; }
    .touch-menu { position: absolute; right: var(--safe-right); bottom: calc(var(--safe-bottom) + 144px); display: none; min-width: 138px; padding: 6px; flex-direction: column; gap: 3px; background: var(--glass-strong); border: 1px solid var(--line); border-radius: 7px; pointer-events: auto; }
    .touch-menu-item { min-height: 34px; padding: 0 10px; display: flex; align-items: center; color: var(--ink-soft); background: transparent; border: 0; border-radius: 4px; font-size: 11px; }

    @media (pointer: fine) {
      .desktop-actions { display: flex; }
    }

    @media (max-width: 720px) {
      #hints { display: none; }
      #nearbyWrap { top: var(--safe-top); width: 158px; }
      #trackModal { padding-right: 14px; padding-left: 14px; padding-bottom: calc(var(--safe-bottom) + 52px); }
      #trackModal .box { width: min(410px, 100%); max-height: 68vh; }
      .url-row { grid-template-columns: 1fr 34px; }
      #urlNameInput { grid-column: 1 / -1; grid-row: 2; }
      #urlPlayBtn { grid-column: 2; grid-row: 1; }
      .enter-card { width: min(430px, 94vw); }
      .enter-row { flex-direction: column; align-items: center; }
      .enter-card input, .btn-main { width: min(260px, 78vw); }
      .btn-main { flex: none; }
      .enter-tip { display: none; }
      .instrument-key { width: 36px; }
      .ping-badge { display: none !important; }
    }

    @media (max-height: 600px) {
      .sigil { display: none; }
      .enter-card > .sub { margin-bottom: 12px; }
      .avatar-picker { margin-bottom: 10px; }
      .enter-tip { display: none; }
      #trackModal .box { max-height: 88vh; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="enter">
    <main class="enter-card">
      <div class="sigil" aria-hidden="true"></div>
      <h1>音遇</h1>
      <p class="sub">靠近一个人，听见他的世界</p>
      <div class="avatar-picker">
        <div class="label">选择旅人</div>
        <div id="avatarGrid" role="list"></div>
      </div>
      <div class="enter-row">
        <input id="enterName" maxlength="12" placeholder="你的名字" autocomplete="off" aria-label="你的名字" />
        <button id="enterBtn" class="btn-main">踏入云野</button>
      </div>
      <div class="enter-tip">建议佩戴耳机 · 无需任务，随心漫游</div>
    </main>
  </div>

  <div id="connectionStatus" class="hud" title="正在连接" role="status" aria-label="正在连接">
    <i data-lucide="wifi"></i>
  </div>

  <button id="musicButton" class="hud panel" title="打开曲库" aria-label="打开曲库">
    <i data-lucide="music-2"></i>
  </button>

  <div id="nearbyWrap" class="hud panel">
    <h3>渐渐听见</h3>
    <div id="nearby"></div>
  </div>

  <div id="flaps" class="hud panel" title="翼能"><i class="on"></i><i class="on"></i><i class="on"></i></div>

  <div id="hints" class="hud panel">
    <div><b>WASD</b> 移动 · <b>Space</b> 飞行 · <b>E</b> 坐下</div>
    <div><b>Enter</b> 说话 · <b>Tab</b> 动作 · <b>G</b> 牵手</div>
  </div>

  <div id="toasts"></div>

  <div id="trackModal" role="dialog" aria-modal="true" aria-labelledby="trackTitle">
    <section class="box panel">
      <header class="modal-head">
        <div><h2 id="trackTitle">随身的歌</h2><p id="trackSubtitle" class="sub">选择一首陪你漫游</p></div>
        <button id="npPlay" class="icon-btn" title="播放" aria-label="播放"><i data-lucide="play"></i></button>
        <button id="trackClose" class="icon-btn" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
      </header>
      <div id="trackGrid"></div>
      <details class="source-details">
        <summary>从链接播放</summary>
        <div class="url-row">
          <input id="urlInput" placeholder="音频直链 https://..." autocomplete="off" spellcheck="false" aria-label="音频直链" />
          <input id="urlNameInput" placeholder="歌曲名（可选）" maxlength="40" autocomplete="off" aria-label="歌曲名" />
          <button id="urlPlayBtn" class="icon-btn" title="播放链接" aria-label="播放链接"><i data-lucide="arrow-right"></i></button>
        </div>
      </details>
      <details class="source-details">
        <summary>我的曲库</summary>
        <div id="songGrid"></div>
        <div class="upload-card" id="uploadCard"><i data-lucide="upload"></i><span>上传音频</span></div>
        <input type="file" id="songFile" accept=".mp3,.ogg,.wav,.m4a,.flac,.aac,audio/*" hidden />
      </details>
    </section>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
