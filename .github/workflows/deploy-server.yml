# 音遇 · 双端部署流水线
# push main → ① EdgeOne 自动构建前端（EdgeOne 侧配置，见 deploy/README.md）
#           → ② Actions SSH 到你的服务器，git pull + docker 重建重启
name: deploy-server
on:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]
  workflow_dispatch: # 允许手动触发

concurrency:
  group: deploy-server
  cancel-in-progress: false # 部署不并发，排队执行

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }} # 服务器 IP
          username: ${{ secrets.DEPLOY_USER }} # SSH 用户
          key: ${{ secrets.DEPLOY_SSH_KEY }} # 私钥（公钥放服务器 authorized_keys）
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }} # 服务器上的仓库路径，如 /www/yinyu
            echo "[$(date '+%H:%M:%S')] 拉取最新代码…"
            # 国内服务器直连 GitHub 被墙：origin 缺失或不可达时改用 ghproxy 镜像
            if ! git remote get-url origin >/dev/null 2>&1 || ! git ls-remote origin >/dev/null 2>&1; then
              git remote remove origin 2>/dev/null || true
              git remote add origin https://ghproxy.net/https://github.com/ShiYioo/children-of-melody.git
            fi
            git fetch origin main
            git reset --hard origin/main
            echo "重建并重启容器…"
            cd server
            docker compose up -d --build
            echo "等待服务就绪（轮询 60s）…"
            ok=0
            for i in $(seq 1 12); do
              sleep 5
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:2567/ || true)
              if [ "$code" = "200" ]; then ok=1; break; fi
            done
            if [ "$ok" = "1" ] && docker inspect --format='{{.State.Health.Status}}' yinyu-server | grep -qE "healthy|starting"; then
              echo "✅ 部署成功，服务已就绪"
            else
              echo "⚠️ 服务未就绪，最近日志："
              docker logs --tail 20 yinyu-server
              exit 1
            fi
